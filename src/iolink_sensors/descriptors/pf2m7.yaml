meta:
  id: pf2m7
  vendor: SMC
  profile: digital_flow_switch

pd:
  frame_type: "4.0"
  in:
    fields:
      - typeprefix: s
        length: 16
        name: process_value
      - typeprefix: b
        length: 1
        name: error_diag
      - typeprefix: b
        length: 1
        name: fixed_output
      - typeprefix: p
        length: 5
        name: _pad1
      - typeprefix: b
        length: 1
        name: meas_diag
      - typeprefix: p
        length: 6
        name: _pad2
      - typeprefix: b
        length: 1
        name: out2
      - typeprefix: b
        length: 1
        name: out1

system_commands:
  zero_clear: 160
  reset_peak_bottom: 170
  reset_accumulated: 190


registers:
  # --- Unit / scaling (read from device, preferred over hard-coded table) ---
  display_unit:
    index: 1000
    subindex: 0
    format: "u8"
    access: rw

  gradient_a:
    index: 8000
    subindex: 0
    format: "<f32"
    access: r

  gradient_b:
    index: 8010
    subindex: 0
    format: "<f32"
    access: r

  # --- OUT1 mode / output type (index 1210) ---
  out1_mode:
    index: 1210
    subindex: 1
    format: "u8"
    access: rw

  out1_output_type:
    index: 1210
    subindex: 2
    format: "u8"
    access: rw

  # --- OUT1 threshold settings (index 1220) ---
  out1_hys_sp:
    index: 1220
    subindex: 1
    format: "s16"
    access: rw

  out1_hys_band:
    index: 1220
    subindex: 2
    format: "s16"
    access: rw

  out1_win_lo:
    index: 1220
    subindex: 3
    format: "s16"
    access: rw

  out1_win_hi:
    index: 1220
    subindex: 4
    format: "s16"
    access: rw

  out1_win_hys:
    index: 1220
    subindex: 5
    format: "s16"
    access: rw

  out1_delay:
    index: 1220
    subindex: 6
    format: "s16"
    access: rw

  # --- OUT1 accumulated output L (index 1300) ---
